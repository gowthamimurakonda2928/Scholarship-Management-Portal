
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Application | ScholarConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a class="logo" href="{{ url_for('home') }}">🎓 ScholarConnect</a>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('scholarships') }}">Scholarships</a>
            <a class="active" href="{{ url_for('application') }}">Apply</a>
            <a href="{{ url_for('documents') }}">Documents</a>
            <a href="{{ url_for('eligibility') }}">Eligibility</a>
            <a href="{{ url_for('profile') }}">Profile</a>
            <a href="{{ url_for('status') }}">Status</a>
        </div>
    </div>
</nav>

<main class="container">
    <h1>Scholarship Application 📝</h1>
    <p>Enter your details carefully to submit your application.</p>

    <form class="form-box"
          action="{{ url_for('application') }}"
          method="POST">

        <label for="student_id">Registered Student ID</label>
        <input type="text"
               id="student_id"
               name="student_id"
               placeholder="Enter your registered Student ID"
               required>

        <label for="scholarship">Select Scholarship</label>
        <select id="scholarship" name="scholarship" required>
            <option value="">Choose a scholarship</option>
            <option value="Merit Scholarship">Merit Scholarship</option>
            <option value="Financial Assistance">Financial Assistance</option>
            <option value="Government Scholarship">Government Scholarship</option>
            <option value="Higher Education Support">Higher Education Support</option>
        </select>

        <label for="academic_score">Academic Percentage (%)</label>
        <input type="number"
               id="academic_score"
               name="academic_score"
               min="0"
               max="100"
               step="0.01"
               placeholder="Enter your percentage"
               required>

        <label for="income">Annual Family Income (₹)</label>
        <input type="number"
               id="income"
               name="income"
               min="0"
               step="0.01"
               placeholder="Enter annual family income"
               required>

        <label for="category">Category</label>
        <select id="category" name="category" required>
            <option value="">Select category</option>
            <option value="General">General</option>
            <option value="OBC">OBC</option>
            <option value="SC">SC</option>
            <option value="ST">ST</option>
            <option value="Other">Other</option>
        </select>

        <button type="submit" class="upload-button">
            Submit Application →
        </button>
    </form>

    <p><a href="{{ url_for('home') }}">← Back to Home</a></p>
</main>

<footer class="footer">
    <p>© 2026 ScholarConnect | Scholarship Management Portal</p>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
